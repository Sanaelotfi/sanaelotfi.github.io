<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" font-family="'Google Sans', system-ui, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <linearGradient id="bfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="awqBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3f2"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <linearGradient id="penBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
  </defs>

  <!-- Section labels -->
  <text x="225" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f598a">Full precision (BF16)</text>
  <text x="700" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">Aggressive PTQ (3-bit AWQ)</text>
  <text x="1175" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f598a">Diagnostic: penalize hesitation tokens</text>

  <!-- ============ LEFT PANEL: BF16 ============ -->
  <rect x="20" y="50" width="410" height="380" rx="14" fill="url(#bfBg)" stroke="#16a34a" stroke-width="1.5"/>

  <!-- prompt -->
  <rect x="40" y="68" width="370" height="48" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="86" font-size="11.5" fill="#475569" font-weight="700">QUESTION</text>
  <text x="50" y="106" font-size="12.5" fill="#0f172a">Largest 8-digit base-2 integer in base 10?</text>

  <!-- reasoning steps -->
  <g font-size="12.5" fill="#0f172a">
    <rect x="40" y="130" width="370" height="22" rx="4" fill="#ffffff" stroke="#d1fae5"/>
    <text x="50" y="146">1. Largest 8-digit binary = 11111111₂</text>

    <rect x="40" y="160" width="370" height="22" rx="4" fill="#ffffff" stroke="#d1fae5"/>
    <text x="50" y="176">2. Sum powers of 2: 128+64+32+...+1</text>

    <rect x="40" y="190" width="370" height="22" rx="4" fill="#ffffff" stroke="#d1fae5"/>
    <text x="50" y="206">3. = 255</text>
  </g>

  <!-- answer pill -->
  <rect x="140" y="240" width="170" height="44" rx="22" fill="#16a34a"/>
  <text x="225" y="269" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Answer: 255 ✓</text>

  <!-- length label -->
  <text x="225" y="320" text-anchor="middle" font-size="13" fill="#475569">~1,124 tokens · terminates</text>

  <!-- decorative trace bar -->
  <rect x="60" y="345" width="330" height="14" rx="7" fill="#dcfce7"/>
  <rect x="60" y="345" width="220" height="14" rx="7" fill="#22c55e"/>
  <text x="225" y="385" text-anchor="middle" font-size="11.5" fill="#475569">Chain of thought</text>

  <!-- ============ MIDDLE PANEL: AWQ spirals ============ -->
  <rect x="450" y="50" width="500" height="380" rx="14" fill="url(#awqBg)" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- correct reasoning bubble -->
  <rect x="470" y="68" width="460" height="56" rx="6" fill="#ffffff" stroke="#d1fae5"/>
  <text x="480" y="86" font-size="11.5" fill="#16a34a" font-weight="700">REACHES CORRECT ANSWER EARLY ✓</text>
  <text x="480" y="106" font-size="12.5" fill="#0f172a">“...sum is 128+64+...+1 = 255.”</text>
  <text x="480" y="120" font-size="11" fill="#64748b">(intermediate step, position ~600/5494)</text>

  <!-- spiral starts -->
  <rect x="470" y="140" width="460" height="26" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="480" y="158" font-size="12.5" fill="#0f172a">“<tspan font-weight="700" fill="#b91c1c">Wait</tspan>, maybe 8-digit means base 10?”</text>

  <rect x="470" y="172" width="460" height="26" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="480" y="190" font-size="12.5" fill="#0f172a">“<tspan font-weight="700" fill="#b91c1c">But</tspan> what if the phrasing is tricky?”</text>

  <rect x="470" y="204" width="460" height="26" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="480" y="222" font-size="12.5" fill="#0f172a">“<tspan font-weight="700" fill="#b91c1c">Alternatively</tspan>, maybe 0s and 1s?”</text>

  <rect x="470" y="236" width="460" height="26" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="480" y="254" font-size="12.5" fill="#0f172a">“<tspan font-weight="700" fill="#b91c1c">Wait. Wait. Wait. Wait.</tspan>”</text>

  <!-- never terminates pill -->
  <rect x="600" y="282" width="200" height="40" rx="20" fill="#b91c1c"/>
  <text x="700" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Never terminates ✗</text>

  <!-- length -->
  <text x="700" y="340" text-anchor="middle" font-size="13" fill="#475569">5,494 tokens · hits max length</text>

  <!-- bar showing inflation -->
  <rect x="475" y="365" width="450" height="14" rx="7" fill="#fee2e2"/>
  <rect x="475" y="365" width="450" height="14" rx="7" fill="#ef4444"/>
  <text x="700" y="405" text-anchor="middle" font-size="11.5" fill="#475569">Chain of thought (<tspan fill="#b91c1c" font-weight="700">~5× longer</tspan>)</text>

  <!-- ============ RIGHT PANEL: Diagnostic ============ -->
  <rect x="970" y="50" width="410" height="380" rx="14" fill="url(#penBg)" stroke="#0ea5e9" stroke-width="1.5"/>

  <!-- step header -->
  <rect x="990" y="68" width="370" height="60" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="1000" y="88" font-size="11.5" fill="#0284c7" font-weight="700">DIAGNOSTIC INTERVENTION</text>
  <text x="1000" y="108" font-size="12.5" fill="#0f172a">Subtract λ from logits of 50 hesitation</text>
  <text x="1000" y="123" font-size="12.5" fill="#0f172a">markers ("Wait", "But", "Alternatively", ...)</text>

  <!-- bars -->
  <text x="990" y="160" font-size="12.5" fill="#475569" font-weight="600">CoT length (avg)</text>

  <!-- baseline bar -->
  <text x="990" y="187" font-size="11.5" fill="#64748b">3-bit AWQ</text>
  <rect x="1080" y="175" width="280" height="16" rx="2" fill="#fee2e2"/>
  <rect x="1080" y="175" width="280" height="16" rx="2" fill="#ef4444"/>
  <text x="1370" y="187" text-anchor="end" font-size="11" fill="#ffffff" font-weight="700">28.0k</text>

  <!-- penalty bar -->
  <text x="990" y="222" font-size="11.5" fill="#64748b">+ penalty</text>
  <rect x="1080" y="210" width="216" height="16" rx="2" fill="#dcfce7"/>
  <rect x="1080" y="210" width="216" height="16" rx="2" fill="#22c55e"/>
  <text x="1306" y="222" text-anchor="end" font-size="11" fill="#ffffff" font-weight="700">21.6k</text>
  <text x="1316" y="222" font-size="11" fill="#16a34a" font-weight="700">−28%</text>

  <!-- accuracy header -->
  <text x="990" y="262" font-size="12.5" fill="#475569" font-weight="600">Accuracy</text>

  <!-- baseline acc -->
  <text x="990" y="289" font-size="11.5" fill="#64748b">3-bit AWQ</text>
  <rect x="1080" y="277" width="58" height="16" rx="2" fill="#ef4444"/>
  <text x="1148" y="289" font-size="11" fill="#475569">29.0</text>

  <!-- penalty acc -->
  <text x="990" y="324" font-size="11.5" fill="#64748b">+ penalty</text>
  <rect x="1080" y="312" width="70" height="16" rx="2" fill="#22c55e"/>
  <text x="1160" y="324" font-size="11" fill="#475569">35.2</text>
  <text x="1196" y="324" font-size="11" fill="#16a34a" font-weight="700">+6.2 pts</text>

  <!-- bottom takeaway -->
  <rect x="990" y="350" width="370" height="60" rx="6" fill="#ffffff" stroke="#bae6fd"/>
  <text x="1000" y="370" font-size="11.5" fill="#0284c7" font-weight="700">CONFIRMS THE DIAGNOSIS</text>
  <text x="1000" y="388" font-size="12" fill="#0f172a">Suppressing these tokens shortens chains</text>
  <text x="1000" y="402" font-size="12" fill="#0f172a">and recovers accuracy: overthinking is the lever.</text>

  <!-- connecting arrows between panels -->
  <line x1="432" y1="240" x2="450" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="952" y1="240" x2="970" y2="240" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>
</svg>
